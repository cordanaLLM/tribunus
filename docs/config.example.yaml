graph:
  max_depth: 12
budgets:
  default:
    tokens: 200000
    wall_clock_seconds: 3600
jobs:
  - name: daily-catalog-sync
    command:
      - /usr/local/bin/tribunusctl
      - sync
    log_path: /var/log/tribunus/daily-catalog-sync.log
    schedule: "0 2 * * *"
    router_alias: cordana/auto
    restart:
      policy: on-failure
      max_restarts: 3
      backoff_seconds: 5
    stop:
      signal: TERM
      grace_seconds: 10
    sandbox:
      mode: enforce
      # Use a dedicated directory per job; it is the only path the job can write.
      workspace: /var/tmp
      inputs: []
      env_allow:
        - TRIBUNUS_JOB_TOKEN
      network: none
      memory_max: 2G
      cpu_weight: 100
      tasks_max: 512
watches:
  - name: catalog-source-change
    trigger: git:internal/sources
    router_alias: cordana/auto
router:
  aliases:
    - cordana/auto
    - cordana/coding
admission:
  probe:
    timeout_seconds: 30
    interval_seconds: 5
    ready_threshold: 2
event_log:
  dir: .tribunus
  signing_key_path: /run/secrets/tribunus-eventlog-seed
  public_key: ""
  lock_timeout_seconds: 5
  max_replay_records: 100000

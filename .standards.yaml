---
version: 1
repository:
  owner: tekmora
  name: epitrop
  visibility: public
  description: ""
  homepage: ""
  topics: []
profiles:
  - framework
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
register:
  sources:
    expected: 13
    sha256:
      sha256:cd68bbc872f295d200abf1f89d007a503368df2b0b67847e24921b02262e3744
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
# Overrides only raise strictness, except the explicit review mode below, which
# permits single-maintainer operation as in cordanaLLM/praetor. Restore independent
# review when a second maintainer or a review bot can approve; the required count
# stays so that restoration keeps the minimum.
overrides:
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    review_mode: single_maintainer
    dismiss_stale_reviews: true
# Documentation drift (praetorctl docs references): a change to a surface must carry a change to
# one of its documents, or a Docs-Waiver with a reason.
docs_surfaces:
  - name: "epitropctl CLI"
    paths:
      - "cmd/epitropctl/*.go"
    exclude:
      - "cmd/epitropctl/*_test.go"
    docs:
      - "README.md"
      - "docs/agent-onboarding.md"
      - "docs/data-sync.md"
  - name: "model catalog and sources"
    paths:
      - "catalog/*.go"
      - "internal/sources/**/*.go"
    exclude:
      - "catalog/*_test.go"
      - "internal/sources/**/*_test.go"
    docs:
      - "docs/agent-onboarding.md"
      - "docs/architecture-v2.md"
      - "docs/data-sync.md"
exceptions:
  # Dated gaps for declared linters that no workflow runs (praetorctl audit, declared-linters).
  # gitleaks runs in ci.yml and needs no entry.
  - rule: declared-linters
    tool: gocognit
    reason: eight functions exceed the HISS-04 caps (three cognitive); the linter is enabled with their refactor (#133)
    expires: "2027-01-11"
  - rule: declared-linters
    tool: gocyclo
    reason: eight functions exceed the HISS-04 caps (five cyclomatic); the linter is enabled with their refactor (#133)
    expires: "2027-01-11"
  - rule: declared-linters
    tool: spectral
    reason: the repository publishes no OpenAPI or AsyncAPI document; its only OpenAPI files are upstream snapshots under internal/sources/*/testdata
    expires: "2027-01-11"

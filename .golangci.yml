---
version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - nilerr
    - unused
    - ineffassign
    - bodyclose
    - noctx
    - gocyclo
    - gocognit
  settings:
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    errcheck:
      check-type-assertions: true
      check-blank: true
  exclusions:
    # One rule per file and linter for the HISS-04 caps; each is a dated exception that
    # tools/lintexceptions checks: a rule without its comment, or past its date, fails.
    rules:
      # category C, expires 2026-10-25, #133
      - path: ^catalog/imports_test\.go$
        linters: [gocognit]
      # category C, expires 2026-10-25, #133
      - path: ^catalog/imports_test\.go$
        linters: [gocyclo]
      # category C, expires 2026-10-25, #133

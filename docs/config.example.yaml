graph:
  max_depth: 12
budgets:
  default:
    tokens: 200000
    wall_clock_seconds: 3600
jobs:
  - name: daily-catalog-sync
    command:
      - /usr/local/bin/tribunusctl
      - sync
    log_path: /var/log/tribunus/daily-catalog-sync.log
    schedule: "0 2 * * *"
    router_alias: cordana/auto
    restart:
      policy: on-failure
      max_restarts: 3
      backoff_seconds: 5
    stop:
      signal: TERM
      grace_seconds: 10
    sandbox:
      mode: enforce
      # Use a dedicated directory per job; it is the only path the job can write.
      workspace: /var/tmp
      inputs: []
      env_allow:
        - TRIBUNUS_JOB_TOKEN
      network: none
      memory_max: 2G
      cpu_weight: 100
      tasks_max: 512
watches:
  - name: catalog-source-change
    trigger: git:internal/sources
    router_alias: cordana/auto
router:
  aliases:
    - cordana/auto
    - cordana/coding
admission:
  probe:
    timeout_seconds: 30
    interval_seconds: 5
    ready_threshold: 2
event_log:
  dir: .tribunus
  signing_key_path: /run/secrets/tribunus-eventlog-seed
  public_key: ""
  lock_timeout_seconds: 5
  max_replay_records: 100000
# The release watch runs as its own supervised, sandboxed job, for example:
#   jobs:
#     - name: release-watch
#       command: [/usr/local/bin/tribunusctl, watch, run, --config=/etc/tribunus/release-watch.yaml]
#       schedule: always
#       restart: {policy: on-failure, max_restarts: 3, backoff_seconds: 300}
#       sandbox:
#         workspace: /var/tmp/tribunus/release-watch   # = state_dir; the seen-set is all it writes
#         inputs: [/etc/tribunus/release-watch.yaml]
#         env_allow: [GITHUB_TOKEN]
#         network: egress
# The job reads a separate file that holds only the release_watch block: the sandbox
# refuses the control-plane config as an input. Run `tribunusctl watch seed` once before
# the first `watch run`, or the first pass files an issue for every release it can see,
# within the caps. Give the job GITHUB_TOKEN: unauthenticated GitHub allows 60 requests an
# hour, below the default rate_limit_floor, so every pass would stop after one request.
release_watch:
  state_dir: /var/tmp/tribunus/release-watch
  rate_limit_floor: 100
  max_actions_per_run: 12
  per_source_cap: 3
  routes:
    - name: serving-stack
      sources:
        - github: example-org/example-upstream
        - huggingface_org: ExampleOrg
      sinks:
        - github_issue:
            repo: example-org/example-consumer
            labels:
              - upstream-release
        # Optional second sink, unused unless configured:
        - ntfy:
            topic: example-topic
            priority: 3

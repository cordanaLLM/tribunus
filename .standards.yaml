---
version: 1
repository:
  owner: cordanaLLM
  name: tribunus
  visibility: public
  description: ""
  homepage: ""
  topics: []
profiles:
  - framework
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
register:
  sources:
    expected: 13
    sha256:
      sha256:cd68bbc872f295d200abf1f89d007a503368df2b0b67847e24921b02262e3744
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
# Overrides only raise strictness, except the explicit review mode below, which
# permits single-maintainer operation as in cordanaLLM/praetor. Restore independent
# review when a second maintainer or a review bot can approve; the required count
# stays so that restoration keeps the minimum.
overrides:
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    review_mode: single_maintainer
    dismiss_stale_reviews: true
exceptions:
  - rule: HISS-11
    path: .github/workflows/release.yml
    reason: adoption found the release workflows short of the declared supply chain (SLSA Build Level 3 declared, Level 0 measured; enforce_cosign without a cosign signing step; require_sbom without an SBOM step); raise them as docs/guides/releasing.md in Praetor describes, then remove this entry
    expires: "2027-01-07"
# Documentation drift (praetorctl docs references): a change to a surface must carry a change to
# one of its documents, or a Docs-Waiver with a reason.
docs_surfaces:
  - name: "tribunusctl CLI"
    paths:
      - "cmd/tribunusctl/*.go"
    exclude:
      - "cmd/tribunusctl/*_test.go"
    docs:
      - "README.md"
      - "docs/agent-onboarding.md"
  - name: "model catalog and sources"
    paths:
      - "catalog/*.go"
      - "internal/sources/**/*.go"
    exclude:
      - "catalog/*_test.go"
      - "internal/sources/**/*_test.go"
    docs:
      - "docs/agent-onboarding.md"
      - "docs/architecture-v2.md"

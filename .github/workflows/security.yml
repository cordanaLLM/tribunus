---
name: Security Scan

'on':
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  # Path-filtered on pull requests: the verdict changes only with the code,
  # the modules or the VEX statements; the nightly run catches new advisories.
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'tools/go/**'
      - 'security/vex/**'
      - '.gosec.json'
      - '.github/workflows/security.yml'

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
          # setup-go's cache key carries no job name, so every job in the
          # repository would share one build cache entry; this job keeps its own.
          cache: false

      # A cache key joins the runner, the go.sum hash and, for the build cache,
      # the commit, and runs past 80 columns, so yamllint's line-length rule is
      # off for the two cache steps alone.
      # yamllint disable rule:line-length
      - name: Restore Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-

      # `vulncheck` names this job's build cache and must differ from every
      # other job's.
      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ runner.arch }}-vulncheck-
      # yamllint enable rule:line-length

      # The scanners come from tools/go/go.mod at pinned versions. govulncheck
      # runs through praetorctl so security/vex/go.openvex.json is honoured,
      # the same verdict the pre-push gate reaches.
      - name: Run govulncheck (VEX-aware)
        run: >-
          go tool -modfile=tools/go/go.mod standardsctl security govuln --path=.
          -- go tool -modfile=tools/go/go.mod govulncheck
      - name: Run gosec
        run: go tool -modfile=tools/go/go.mod gosec -conf .gosec.json ./...

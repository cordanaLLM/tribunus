# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: epitropctl

builds:
  - id: epitropctl
    main: ./cmd/epitropctl
    binary: epitropctl
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: epitropctl
    ids:
      - epitropctl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "epitropctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - LICENSES/*

sboms:
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=${document}"]

signs:
  - id: cosign-keyless
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum

# The snapshot schema is listed in checksums.txt like every archive and SBOM.
# The signature covers that file and the provenance names every file in it, so
# the schema is signed and attested with them. The entry below must name the
# same file under the same name as release.extra_files, which uploads it.
checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: catalog/snapshot.schema.json
      name_template: snapshot.schema.json

# The snapshot schema ships beside the binaries, so Praetor can pin the exact
# contract a release writes (catalog/snapshot.schema.json, version 1).
release:
  draft: true
  replace_existing_draft: true
  # A tag with a prerelease suffix (v0.1.0-rc.1) publishes as a prerelease, which
  # GitHub never marks as the latest release; the default (false) would.
  prerelease: auto
  extra_files:
    - glob: catalog/snapshot.schema.json
      name_template: snapshot.schema.json

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# The release notes are not generated here. The release workflow passes the
# tag's section of CHANGELOG.md with --release-notes (tools/releasenotes), and
# GoReleaser then builds no changelog of its own. `changelog.disable` must stay
# unset: it skips the step that reads the notes file as well.
